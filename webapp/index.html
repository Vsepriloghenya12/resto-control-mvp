<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('pwa') === 'bookings') {
          document.querySelector('link[rel="manifest"]').setAttribute('href', '/manifest-bookings.webmanifest');
        }
      })();
    </script>
    <title>Resto Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
